name: Build Free Radio

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.7.0'
  KF_VERSION: '6.3.0'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: '25.1.8937393' # NDK r25b
  FFMPEG_VERSION: '8.0.3'
  OPENSSL_VERSION: '3.0.21'

jobs:
  catalog-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check canonical station catalog and package invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/radiodata_catalog.py check
          python3 -m unittest discover -s tests
          python3 -m unittest discover -s freeradio/tests -p 'test_*.py'

          forbidden=$(git grep -n -E \
            '(^|[^[:alnum:]_])(import[[:space:]]+QtMultimedia|Qt6?::Multimedia|QMediaPlayer|QAudio(Output|Sink|Source))' \
            -- freeradio ':!freeradio/tests/audio/QmlImportTest.cpp' || true)
          if [[ -n "$forbidden" ]]; then
            printf 'QtMultimedia fallback references are forbidden:\n%s\n' "$forbidden" >&2
            exit 1
          fi

          needle="qt""multimedia"
          if git grep -n -i "$needle" -- .github cmake freeradio/CMakeLists.txt; then
            echo 'QtMultimedia provisioning is forbidden.' >&2
            exit 1
          fi

  ffmpeg-source-compliance:
    needs: catalog-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch and verify pinned LGPL FFmpeg source
        shell: bash
        run: |
          set -euo pipefail
          scripts/ffmpeg/fetch-ffmpeg.sh
          mkdir -p ffmpeg-compliance
          cp "build/downloads/ffmpeg-${FFMPEG_VERSION}.tar.xz" ffmpeg-compliance/
          cp LICENSES/FFmpeg-LGPL-2.1-or-later.txt LICENSES/FFmpeg-NOTICE.txt ffmpeg-compliance/
          scripts/ffmpeg/configure-common.sh > ffmpeg-compliance/configuration.txt
          sha256sum ffmpeg-compliance/* > ffmpeg-compliance/SHA256SUMS

      - name: Upload corresponding source and compliance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FFmpeg-${{ env.FFMPEG_VERSION }}-LGPL-Source-Compliance
          path: ffmpeg-compliance/
          if-no-files-found: error

  build-android:
    needs: catalog-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: x86_64
            qt_arch: android_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK 34, build tools, and NDK r25b
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools'
          cache: true

      - name: Cache pinned Android OpenSSL
        id: openssl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/openssl
            ~/.cache/freeradio/openssl-${{ env.OPENSSL_VERSION }}.tar.gz
          key: android-openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.abi }}-${{ hashFiles('scripts/openssl/**') }}

      - name: Build pinned OpenSSL for ${{ matrix.abi }}
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          scripts/openssl/build-android.sh \
            --ndk "$ANDROID_NDK_ROOT" \
            --abi "${{ matrix.abi }}" \
            --prefix "$RUNNER_TEMP/openssl" \
            --jobs 2

      - name: Validate pinned OpenSSL staging
        shell: bash
        run: |
          set -euo pipefail
          for library in libcrypto_3.so libssl_3.so; do
            test -f "$RUNNER_TEMP/openssl/${{ matrix.abi }}/$library"
          done

      - name: Build pinned LGPL FFmpeg for ${{ matrix.abi }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/ffmpeg/build-android.sh \
            --ndk "$ANDROID_NDK_ROOT" \
            --api 24 \
            --abi "${{ matrix.abi }}" \
            --prefix "$RUNNER_TEMP/ffmpeg/${{ matrix.abi }}" \
            --jobs 2

      - name: Configure Android debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg="$RUNNER_TEMP/ffmpeg/${{ matrix.abi }}"
          cmake -S freeradio -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${ANDROID_API_LEVEL}" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_ABIS="${{ matrix.abi }}" \
            -DQT_ANDROID_TARGET_SDK_VERSION="${ANDROID_API_LEVEL}" \
            -DFREERADIO_ANDROID_OPENSSL_ROOT="$RUNNER_TEMP/openssl" \
            -DFREERADIO_FFMPEG_PROVIDER=EXPLICIT \
            -DFREERADIO_FFMPEG_INCLUDE_DIR="$ffmpeg/include" \
            -DFREERADIO_AVFORMAT_LIBRARY="$ffmpeg/lib/libavformat.so" \
            -DFREERADIO_AVCODEC_LIBRARY="$ffmpeg/lib/libavcodec.so" \
            -DFREERADIO_AVUTIL_LIBRARY="$ffmpeg/lib/libavutil.so" \
            -DFREERADIO_SWRESAMPLE_LIBRARY="$ffmpeg/lib/libswresample.so" \
            -DBUILD_TESTING=OFF

      - name: Require protected Android signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 QT_ANDROID_KEYSTORE_ALIAS \
            QT_ANDROID_KEYSTORE_STORE_PASS QT_ANDROID_KEYSTORE_KEY_PASS; do
            [[ -n "${!variable:-}" ]] || { echo "Required protected secret $variable is not configured" >&2; exit 1; }
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/freeradio-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/freeradio-release.jks" \
            -storepass "$QT_ANDROID_KEYSTORE_STORE_PASS" \
            -alias "$QT_ANDROID_KEYSTORE_ALIAS" >/dev/null

      - name: Configure signed Android release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/freeradio-release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ffmpeg="$RUNNER_TEMP/ffmpeg/${{ matrix.abi }}"
          cmake -S freeradio -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${ANDROID_API_LEVEL}" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_ABIS="${{ matrix.abi }}" \
            -DQT_ANDROID_TARGET_SDK_VERSION="${ANDROID_API_LEVEL}" \
            -DQT_ANDROID_SIGN_APK=ON \
            -DFREERADIO_FFMPEG_PROVIDER=EXPLICIT \
            -DFREERADIO_FFMPEG_INCLUDE_DIR="$ffmpeg/include" \
            -DFREERADIO_AVFORMAT_LIBRARY="$ffmpeg/lib/libavformat.so" \
            -DFREERADIO_AVCODEC_LIBRARY="$ffmpeg/lib/libavcodec.so" \
            -DFREERADIO_AVUTIL_LIBRARY="$ffmpeg/lib/libavutil.so" \
            -DFREERADIO_SWRESAMPLE_LIBRARY="$ffmpeg/lib/libswresample.so" \
            -DBUILD_TESTING=OFF

      - name: Build APK
        shell: bash
        env:
          QT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/freeradio-release.jks
          QT_ANDROID_KEYSTORE_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_ALIAS || '' }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          cmake --build build-android --target apk --parallel 2

      - name: Validate and stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            mapfile -t apks < <(find build-android -type f -name '*-signed.apk')
          else
            mapfile -t apks < <(find build-android -type f -name '*-debug.apk')
          fi
          [[ ${#apks[@]} -eq 1 ]] || { printf 'Expected exactly one APK, found: %s\n' "${apks[*]:-none}" >&2; exit 1; }
          cp "${apks[0]}" "dist/FreeRadio-Android-${{ matrix.abi }}.apk"

          apk="dist/FreeRadio-Android-${{ matrix.abi }}.apk"
          "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$apk"
          "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$apk" | grep -F "package: name='org.freeradio.app'"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          grep -E "^lib/${{ matrix.abi }}/libfreeradio(_${{ matrix.abi }})?\\.so$" "$RUNNER_TEMP/apk-entries.txt"
          for library in avformat avcodec avutil swresample; do
            grep -Fx "lib/${{ matrix.abi }}/lib${library}.so" "$RUNNER_TEMP/apk-entries.txt"
          done
          for library in crypto ssl; do
            grep -Fx "lib/${{ matrix.abi }}/lib${library}_3.so" "$RUNNER_TEMP/apk-entries.txt"
          done
          if grep -i 'Qt6Multimedia' "$RUNNER_TEMP/apk-entries.txt"; then
            echo 'APK unexpectedly contains QtMultimedia.' >&2
            exit 1
          fi
          if grep -E '^lib/(arm64-v8a|x86_64)/' "$RUNNER_TEMP/apk-entries.txt" | \
              grep -v "^lib/${{ matrix.abi }}/"; then
            echo 'Matrix APK contains an unexpected ABI.' >&2
            exit 1
          fi

      - name: Smoke-test x86_64 APK in emulator
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "dist/FreeRadio-Android-x86_64.apk"
            adb shell am start -W -n org.freeradio.app/.FreeRadioActivity
            sleep 10
            adb shell pidof org.freeradio.app
            adb shell dumpsys activity activities | grep -F org.freeradio.app

      - name: Capture Android logs on failure
        if: failure() && matrix.abi == 'x86_64'
        shell: bash
        run: adb logcat -d > android-logcat.txt 2>&1 || true

      - name: Upload Android logs on failure
        if: failure() && matrix.abi == 'x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FreeRadio-Android-x86_64-logs
          path: android-logcat.txt
          if-no-files-found: warn

      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FreeRadio-Android-${{ matrix.abi }}-${{ startsWith(github.ref, 'refs/tags/v') && 'Release' || 'Debug' }}
          path: dist/FreeRadio-Android-${{ matrix.abi }}.apk
          if-no-files-found: error

  build-plasmoid:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: catalog-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Plasmoid
        run: |
          cd freeradio
          zip -r ../freeradio.plasmoid \
            metadata.json \
            contents/ \
            -x "*.o" -x "*.so" -x "build/*" \
            -x "contents/ui/radiodata_radcap.js"

      - name: Upload Plasmoid artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FreeRadio-Plasmoid
          path: freeradio.plasmoid

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: catalog-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libpulse-dev \
            libgl1-mesa-dev \
            fuse \
            libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtshadertools'
          cache: true

      - name: Build extra-cmake-modules
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/extra-cmake-modules.git
          cmake -B ecm-build -S extra-cmake-modules -G Ninja -DCMAKE_INSTALL_PREFIX=$HOME/kde
          cmake --build ecm-build
          cmake --install ecm-build

      - name: Build Kirigami from source
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/kirigami.git
          cmake -B kirigami-build -S kirigami -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR;$HOME/kde" \
            -DCMAKE_INSTALL_PREFIX=$HOME/kde \
            -DBUILD_TESTING=OFF \
            -DBUILD_QCH=OFF
          cmake --build kirigami-build --parallel
          cmake --install kirigami-build

      - name: Configure
        run: |
          cmake -B build -S freeradio \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR;$HOME/kde" \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Package AppDir
        run: |
          DESTDIR=$PWD/AppDir cmake --install build
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp freeradio/icons/freeradio.svg AppDir/usr/share/icons/hicolor/scalable/apps/

      - name: Create AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QMAKE=$QT_ROOT_DIR/bin/qmake
          export QML_SOURCES_PATHS=$PWD/freeradio/contents/ui
          export EXTRA_QT_PLUGINS="multimedia"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file freeradio/freeradio.desktop \
            --icon-file freeradio/icons/freeradio.svg \
            --plugin qt \
            --output appimage

          mv Free_Radio*.AppImage FreeRadio-Linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FreeRadio-Linux
          path: FreeRadio-Linux-x86_64.AppImage

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: catalog-check
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtshadertools'
          cache: true

      - name: Install build tools
        run: |
          brew install ninja extra-cmake-modules imagemagick

      - name: Build Kirigami from source
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/kirigami.git
          cmake -B kirigami-build -S kirigami -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
            -DCMAKE_INSTALL_PREFIX=$HOME/kde \
            -DBUILD_TESTING=OFF \
            -DBUILD_QCH=OFF
          cmake --build kirigami-build --parallel
          cmake --install kirigami-build

      - name: Configure
        run: |
          cmake -B build -S freeradio \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR;$HOME/kde"

      - name: Build
        run: cmake --build build --parallel

      - name: Create App Bundle
        run: |
          cd build

          # CMake creates freeradio.app bundle, rename it
          mv freeradio.app "Free Radio.app"

          # Add Info.plist
          cp ../packaging/macos/Info.plist "Free Radio.app/Contents/"

          # Create macOS icon from PNG using ImageMagick
          mkdir -p freeradio.iconset
          magick ../freeradio/icons/freeradio.png -resize 16x16 PNG32:freeradio.iconset/icon_16x16.png
          magick ../freeradio/icons/freeradio.png -resize 32x32 PNG32:freeradio.iconset/icon_16x16@2x.png
          magick ../freeradio/icons/freeradio.png -resize 32x32 PNG32:freeradio.iconset/icon_32x32.png
          magick ../freeradio/icons/freeradio.png -resize 64x64 PNG32:freeradio.iconset/icon_32x32@2x.png
          magick ../freeradio/icons/freeradio.png -resize 128x128 PNG32:freeradio.iconset/icon_128x128.png
          magick ../freeradio/icons/freeradio.png -resize 256x256 PNG32:freeradio.iconset/icon_128x128@2x.png
          magick ../freeradio/icons/freeradio.png -resize 256x256 PNG32:freeradio.iconset/icon_256x256.png
          magick ../freeradio/icons/freeradio.png -resize 512x512 PNG32:freeradio.iconset/icon_256x256@2x.png
          magick ../freeradio/icons/freeradio.png -resize 512x512 PNG32:freeradio.iconset/icon_512x512.png
          magick ../freeradio/icons/freeradio.png -resize 1024x1024 PNG32:freeradio.iconset/icon_512x512@2x.png
          iconutil -c icns freeradio.iconset -o "Free Radio.app/Contents/Resources/freeradio.icns"

          # Kirigami is built into the custom $HOME/kde prefix, which macdeployqt does
          # NOT scan -- so without this its QML plugin never lands in the bundle and the
          # app dies at launch with: module "org.kde.kirigami" plugin not found.
          # Find the Kirigami QML module and pass its import root to macdeployqt.
          kirigami_mod="$(find "$HOME/kde" -type d -path '*/org/kde/kirigami' | head -1)"
          qml_import_root="${kirigami_mod%/org/kde/kirigami}"
          echo "Kirigami QML import root: ${qml_import_root:-<not found>}"

          # Deploy Qt frameworks (+ the Kirigami QML module from the custom prefix)
          macdeployqt "Free Radio.app" \
            -qmldir=../freeradio/contents/ui \
            -qmlimport="$qml_import_root" \
            -verbose=1

          # Ad-hoc re-sign the WHOLE bundle after macdeployqt. macdeployqt rewrites the
          # copied Qt frameworks with install_name_tool, which invalidates their code
          # signatures; on Apple Silicon dyld then refuses to load them and the kernel
          # kills the app on launch (no window, not in the running-apps list). A deep
          # ad-hoc signature ("-") is free -- no Apple Developer account, no notarization
          # -- and makes the bundle launchable. Users still must clear quarantine once:
          #   xattr -dr com.apple.quarantine "/Applications/Free Radio.app"
          codesign --force --deep --sign - "Free Radio.app"
          codesign --verify --verbose "Free Radio.app"

          # Create DMG
          hdiutil create -volname "Free Radio" \
            -srcfolder "Free Radio.app" \
            -ov -format UDZO \
            FreeRadio-macOS.dmg

      - name: Verify bundle launches
        run: |
          set -euo pipefail
          binary="build/Free Radio.app/Contents/MacOS/freeradio"
          mkdir -p "$RUNNER_TEMP/launch"
          "$binary" >"$RUNNER_TEMP/launch/stdout.log" 2>"$RUNNER_TEMP/launch/stderr.log" &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "Bundle stayed alive for 5 seconds -- launch OK."
            exit 0
          fi
          wait "$pid" || status=$?
          echo "Bundle exited early with status ${status:-0} -- failing the build." >&2
          echo "--- stderr ---"; cat "$RUNNER_TEMP/launch/stderr.log" || true
          exit 1

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FreeRadio-macOS
          path: build/FreeRadio-macOS.dmg
          if-no-files-found: error

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: catalog-check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtshadertools'
          cache: true
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build extra-cmake-modules
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/extra-cmake-modules.git
          cmake -B ecm-build -S extra-cmake-modules -G Ninja -DCMAKE_INSTALL_PREFIX=C:/kde
          cmake --build ecm-build
          cmake --install ecm-build

      - name: Build Kirigami
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/kirigami.git
          cmake -B kirigami-build -S kirigami -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;C:/kde" `
            -DCMAKE_INSTALL_PREFIX=C:/kde `
            -DBUILD_TESTING=OFF `
            -DBUILD_QCH=OFF
          cmake --build kirigami-build --parallel
          cmake --install kirigami-build

      - name: Configure
        run: |
          cmake -B build -S freeradio -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;C:/kde"

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          cp build/freeradio.exe dist/

          # Deploy Qt (QT_ROOT_DIR is set by install-qt-action)
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" dist/freeradio.exe `
            --qmldir freeradio/contents/ui `
            --no-translations

          # Copy Kirigami DLLs and QML modules
          if (Test-Path C:/kde/bin) {
            Copy-Item C:/kde/bin/*.dll dist/ -ErrorAction Stop
          }
          if (Test-Path C:/kde/lib/qml) {
            Copy-Item -Recurse C:/kde/lib/qml/* dist/ -ErrorAction Stop
          }

          # Create portable zip
          Compress-Archive -Path dist/* -DestinationPath FreeRadio-Windows-Portable-x64.zip

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "packaging/windows/vc_redist.x64.exe"

      - name: Build Installer
        shell: pwsh
        run: |
          # Install Inno Setup
          choco install innosetup -y

          # Copy dist folder for installer
          Copy-Item -Recurse dist packaging/windows/

          # Build installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss

      - name: Upload Windows Portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FreeRadio-Windows-Portable
          path: FreeRadio-Windows-Portable-x64.zip

      - name: Upload Windows Installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FreeRadio-Windows-Installer
          path: build-installer/FreeRadio-Setup-x64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ffmpeg-source-compliance, build-android, build-plasmoid, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/FreeRadio-Plasmoid/*
            artifacts/FreeRadio-Linux/*
            artifacts/FreeRadio-macOS/*
            artifacts/FreeRadio-Windows-Portable/*
            artifacts/FreeRadio-Windows-Installer/*
            artifacts/FreeRadio-Android-arm64-v8a-Release/*
            artifacts/FreeRadio-Android-x86_64-Release/*
            artifacts/FFmpeg-${{ env.FFMPEG_VERSION }}-LGPL-Source-Compliance/*
          draft: false
          generate_release_notes: true
