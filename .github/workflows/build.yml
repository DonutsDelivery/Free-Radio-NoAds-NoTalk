name: Build DonutRadio

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.7.0'
  KF_VERSION: '6.3.0'

jobs:
  catalog-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check canonical station catalog
        run: |
          python3 tools/radiodata_catalog.py check
          python3 -m unittest discover -s tests

  build-plasmoid:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: catalog-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Plasmoid
        run: |
          cd freeradio
          zip -r ../donutradio.plasmoid \
            metadata.json \
            contents/ \
            -x "*.o" -x "*.so" -x "*.backup" -x "build/*" \
            -x "contents/ui/radiodata_radcap.js"

      - name: Upload Plasmoid artifact
        uses: actions/upload-artifact@v4
        with:
          name: DonutRadio-Plasmoid
          path: donutradio.plasmoid

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: catalog-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libpulse-dev \
            libgl1-mesa-dev \
            fuse \
            libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia qtshadertools'
          cache: true

      - name: Build extra-cmake-modules
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/extra-cmake-modules.git
          cmake -B ecm-build -S extra-cmake-modules -G Ninja -DCMAKE_INSTALL_PREFIX=$HOME/kde
          cmake --build ecm-build
          cmake --install ecm-build

      - name: Build Kirigami from source
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/kirigami.git
          cmake -B kirigami-build -S kirigami -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR;$HOME/kde" \
            -DCMAKE_INSTALL_PREFIX=$HOME/kde \
            -DBUILD_TESTING=OFF \
            -DBUILD_QCH=OFF
          cmake --build kirigami-build --parallel
          cmake --install kirigami-build

      - name: Configure
        run: |
          cmake -B build -S freeradio \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR;$HOME/kde" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DDONUTRADIO_INSTALL_PLASMOID=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Package AppDir
        run: |
          # cmake --install stages the binary, QML audio plugin, desktop file,
          # metainfo and icons. Nothing is copied by hand.
          DESTDIR=$PWD/AppDir cmake --install build

      - name: Create AppImage
        run: |
          APP_ID=online.donutsdelivery.DonutRadio
          ICON=freeradio/icons/hicolor/256x256/apps/$APP_ID.png

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QMAKE=$QT_ROOT_DIR/bin/qmake
          export QML_SOURCES_PATHS=$PWD/freeradio/contents/ui
          export QML_MODULES_PATHS=$PWD/AppDir/usr/lib/qt6/qml
          export LD_LIBRARY_PATH=$PWD/AppDir/usr/lib:$LD_LIBRARY_PATH
          export EXTRA_QT_PLUGINS="multimedia"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file freeradio/$APP_ID.desktop \
            --icon-file $ICON \
            --plugin qt

          # AppImage root files that linuxdeploy did not create
          [ -e AppDir/.DirIcon ] || cp $ICON AppDir/.DirIcon
          [ -e AppDir/$APP_ID.png ] || cp $ICON AppDir/$APP_ID.png
          [ -e AppDir/$APP_ID.desktop ] || cp AppDir/usr/share/applications/$APP_ID.desktop AppDir/$APP_ID.desktop
          mkdir -p AppDir/usr/share/metainfo
          [ -e AppDir/usr/share/metainfo/$APP_ID.metainfo.xml ] || cp freeradio/$APP_ID.metainfo.xml AppDir/usr/share/metainfo/

          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

          mv DonutRadio*.AppImage DonutRadio-Linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: DonutRadio-Linux
          path: DonutRadio-Linux-x86_64.AppImage

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: catalog-check
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia qtshadertools'
          cache: true

      - name: Install build tools
        run: |
          brew install ninja extra-cmake-modules imagemagick

      - name: Build Kirigami from source
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/kirigami.git
          cmake -B kirigami-build -S kirigami -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
            -DCMAKE_INSTALL_PREFIX=$HOME/kde \
            -DBUILD_TESTING=OFF \
            -DBUILD_QCH=OFF
          cmake --build kirigami-build --parallel
          cmake --install kirigami-build

      - name: Configure
        run: |
          cmake -B build -S freeradio \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR;$HOME/kde"

      - name: Build
        run: cmake --build build --parallel

      - name: Create App Bundle
        run: |
          cd build

          # CMake creates donutradio.app. The macOS file system ignores case, so a
          # direct mv to DonutRadio.app fails as "same file"; go through a temp name.
          mv donutradio.app DonutRadio-tmp.app
          mv DonutRadio-tmp.app "DonutRadio.app"

          # Add Info.plist
          cp ../packaging/macos/Info.plist "DonutRadio.app/Contents/"

          # Create macOS icon from PNG using ImageMagick
          mkdir -p donutradio.iconset
          magick ../freeradio/icons/donutradio.png -resize 16x16 PNG32:donutradio.iconset/icon_16x16.png
          magick ../freeradio/icons/donutradio.png -resize 32x32 PNG32:donutradio.iconset/icon_16x16@2x.png
          magick ../freeradio/icons/donutradio.png -resize 32x32 PNG32:donutradio.iconset/icon_32x32.png
          magick ../freeradio/icons/donutradio.png -resize 64x64 PNG32:donutradio.iconset/icon_32x32@2x.png
          magick ../freeradio/icons/donutradio.png -resize 128x128 PNG32:donutradio.iconset/icon_128x128.png
          magick ../freeradio/icons/donutradio.png -resize 256x256 PNG32:donutradio.iconset/icon_128x128@2x.png
          magick ../freeradio/icons/donutradio.png -resize 256x256 PNG32:donutradio.iconset/icon_256x256.png
          magick ../freeradio/icons/donutradio.png -resize 512x512 PNG32:donutradio.iconset/icon_256x256@2x.png
          magick ../freeradio/icons/donutradio.png -resize 512x512 PNG32:donutradio.iconset/icon_512x512.png
          magick ../freeradio/icons/donutradio.png -resize 1024x1024 PNG32:donutradio.iconset/icon_512x512@2x.png
          iconutil -c icns donutradio.iconset -o "DonutRadio.app/Contents/Resources/donutradio.icns" || echo "Icon creation failed, continuing without custom icon"

          # Kirigami is built into the custom $HOME/kde prefix, which macdeployqt does
          # NOT scan -- so without this its QML plugin never lands in the bundle and the
          # app dies at launch with: module "org.kde.kirigami" plugin not found.
          # Find the Kirigami QML module and pass its import root to macdeployqt.
          kirigami_mod="$(find "$HOME/kde" -type d -path '*/org/kde/kirigami' | head -1)"
          qml_import_root="${kirigami_mod%/org/kde/kirigami}"
          echo "Kirigami QML import root: ${qml_import_root:-<not found>}"

          # Deploy Qt frameworks (+ the Kirigami QML module from the custom prefix)
          macdeployqt "DonutRadio.app" \
            -qmldir=../freeradio/contents/ui \
            -qmlimport="$qml_import_root" \
            -verbose=1 || true

          # Ad-hoc re-sign the WHOLE bundle after macdeployqt. macdeployqt rewrites the
          # copied Qt frameworks with install_name_tool, which invalidates their code
          # signatures; on Apple Silicon dyld then refuses to load them and the kernel
          # kills the app on launch (no window, not in the running-apps list). A deep
          # ad-hoc signature ("-") is free -- no Apple Developer account, no notarization
          # -- and makes the bundle launchable. Users still must clear quarantine once:
          #   xattr -dr com.apple.quarantine "/Applications/DonutRadio.app"
          codesign --force --deep --sign - "DonutRadio.app"
          codesign --verify --verbose "DonutRadio.app" || echo "ad-hoc signature verify failed"

          # Create DMG
          hdiutil create -volname "DonutRadio" \
            -srcfolder "DonutRadio.app" \
            -ov -format UDZO \
            DonutRadio-macOS.dmg || echo "DMG creation failed"

      - name: Verify bundle launches
        run: |
          set -euo pipefail
          binary="build/DonutRadio.app/Contents/MacOS/donutradio"
          mkdir -p "$RUNNER_TEMP/launch"
          "$binary" >"$RUNNER_TEMP/launch/stdout.log" 2>"$RUNNER_TEMP/launch/stderr.log" &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "Bundle stayed alive for 5 seconds -- launch OK."
            exit 0
          fi
          wait "$pid" || status=$?
          echo "Bundle exited early with status ${status:-0} -- failing the build." >&2
          echo "--- stderr ---"; cat "$RUNNER_TEMP/launch/stderr.log" || true
          exit 1

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DonutRadio-macOS
          path: build/DonutRadio-macOS.dmg
          if-no-files-found: ignore

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: catalog-check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia qtshadertools'
          cache: true
          arch: win64_msvc2019_64

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build extra-cmake-modules
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/extra-cmake-modules.git
          cmake -B ecm-build -S extra-cmake-modules -G Ninja -DCMAKE_INSTALL_PREFIX=C:/kde
          cmake --build ecm-build
          cmake --install ecm-build

      - name: Build Kirigami
        run: |
          git clone --depth 1 --branch v${{ env.KF_VERSION }} https://invent.kde.org/frameworks/kirigami.git
          cmake -B kirigami-build -S kirigami -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;C:/kde" `
            -DCMAKE_INSTALL_PREFIX=C:/kde `
            -DBUILD_TESTING=OFF `
            -DBUILD_QCH=OFF
          cmake --build kirigami-build --parallel
          cmake --install kirigami-build

      - name: Configure
        run: |
          cmake -B build -S freeradio -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;C:/kde"

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          cp build/donutradio.exe dist/

          # Deploy Qt (QT_ROOT_DIR is set by install-qt-action)
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" dist/donutradio.exe `
            --qmldir freeradio/contents/ui `
            --no-translations

          # Copy Kirigami DLLs and QML modules
          if (Test-Path C:/kde/bin) {
            Copy-Item C:/kde/bin/*.dll dist/ -ErrorAction SilentlyContinue
          }
          if (Test-Path C:/kde/lib/qml) {
            Copy-Item -Recurse C:/kde/lib/qml/* dist/ -ErrorAction SilentlyContinue
          }

          # Create portable zip
          Compress-Archive -Path dist/* -DestinationPath DonutRadio-Windows-Portable-x64.zip

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "packaging/windows/vc_redist.x64.exe"

      - name: Build Installer
        shell: pwsh
        run: |
          # Install Inno Setup
          choco install innosetup -y

          # Copy dist folder for installer
          Copy-Item -Recurse dist packaging/windows/

          # Build installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: DonutRadio-Windows-Portable
          path: DonutRadio-Windows-Portable-x64.zip

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: DonutRadio-Windows-Installer
          path: build-installer/DonutRadio-Setup-x64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-plasmoid, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DonutRadio-Plasmoid/*
            artifacts/DonutRadio-Linux/*
            artifacts/DonutRadio-macOS/*
            artifacts/DonutRadio-Windows-Portable/*
            artifacts/DonutRadio-Windows-Installer/*
          draft: false
          generate_release_notes: true
